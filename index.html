<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترجمان — ترجمة عربي ⇄ إنجليزي</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper: #EAF1F2; --surface: #FFFFFF; --ink: #0E2A33; --muted: #5A6F77;
  --line: #CFDCDF; --accent: #0E7C86; --accent-ink: #FFFFFF; --accent-soft: #D7ECEE;
  --good: #1B8A4B; --good-soft: #D8F0E2; --bad: #C2383B; --bad-soft: #F8DEDF;
  --font: "Readex Pro", system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A181D; --surface: #11262D; --ink: #E7F1F3; --muted: #93AAB2;
    --line: #234049; --accent: #4FC3CC; --accent-ink: #062228; --accent-soft: #14383F;
    --good: #55D08A; --good-soft: #15382A; --bad: #FF8587; --bad-soft: #432024;
  }
}
:root[data-theme="dark"] {
  --paper: #0A181D; --surface: #11262D; --ink: #E7F1F3; --muted: #93AAB2;
  --line: #234049; --accent: #4FC3CC; --accent-ink: #062228; --accent-soft: #14383F;
  --good: #55D08A; --good-soft: #15382A; --bad: #FF8587; --bad-soft: #432024;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brand { font-weight: 700; font-size: 30px; letter-spacing: 0; margin: 0; line-height: 1.2; }
.brand small { display: block; font-weight: 300; font-size: 14px; color: var(--muted); margin-top: 2px; }
.theme-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 42px; height: 42px; display: grid; place-items: center; }
nav.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 5px; margin-bottom: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 5; }
nav.tabs button { border: 0; background: transparent; border-radius: 10px; padding: 10px 8px; font-weight: 500; color: var(--muted); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.count { display: inline-block; min-width: 1.6em; padding: 0 6px; margin-inline-start: 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
nav.tabs button[aria-selected="true"] .count { background: rgba(255,255,255,.22); color: var(--accent-ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.card + .card { margin-top: 14px; }
.dir-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: var(--muted); font-size: 15px; }
.dir-badge { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 14px; font-weight: 500; }
textarea { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--paper); font-size: 20px; line-height: 1.6; }
textarea::placeholder { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.row .grow { flex: 1; }
.hint { color: var(--muted); font-size: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 18px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { opacity: .55; cursor: progress; }
.btn.small { padding: 5px 12px; font-size: 14px; border-radius: 9px; }
.btn.danger { color: var(--bad); }
.result { margin-top: 14px; }
.result .src { color: var(--muted); font-size: 16px; margin: 0 0 6px; }
.result .out { font-size: 28px; line-height: 1.5; font-weight: 500; margin: 0; word-break: break-word; }
.result .out[dir="ltr"] { text-align: left; }
.err { color: var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
.words-title { margin: 18px 0 8px; font-size: 15px; font-weight: 500; color: var(--muted); }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.word { border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: 10px; padding: 8px 12px; background: var(--paper); }
.word .en { direction: ltr; text-align: left; font-weight: 600; font-size: 17px; line-height: 1.4; }
.word .ar { color: var(--muted); font-size: 16px; line-height: 1.4; }
.quiz h2 { margin: 0 0 4px; font-size: 20px; }
.quiz .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 14px; }
.bar { height: 6px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.q-label { color: var(--muted); font-size: 15px; text-align: center; margin: 0; }
.q-word { direction: ltr; text-align: center; font-size: 40px; font-weight: 700; line-height: 1.25; margin: 6px 0 20px; word-break: break-word; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .opts { grid-template-columns: 1fr; } }
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 12px; font-size: 19px; font-weight: 500; text-align: center; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.reveal { text-align: center; font-size: 26px; font-weight: 600; min-height: 1.6em; margin: 4px 0 16px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
.reveal.hidden { color: var(--muted); font-weight: 400; font-size: 16px; }
.feedback { text-align: center; margin-top: 14px; font-weight: 500; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.score { font-size: 54px; font-weight: 700; text-align: center; line-height: 1.2; margin: 6px 0; }
.center { text-align: center; }
.missed { margin-top: 14px; }
.sec-title { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 10px; }
.sec-title h2 { margin: 0; font-size: 19px; }
.entry .tx { display: grid; gap: 4px; margin-bottom: 10px; }
.entry .a { font-size: 19px; font-weight: 500; }
.entry .b { font-size: 17px; color: var(--muted); }
.entry [dir="ltr"] { text-align: left; }
.entry .tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.entry time { color: var(--muted); font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.empty b { display: block; color: var(--ink); font-size: 19px; margin-bottom: 4px; }
.spk { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 36px; height: 36px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; line-height: 1; flex: none; }
.spk.lbl { font-size: 14px; padding: 0 14px; }
.spk:hover { border-color: var(--accent); }
.en-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; direction: ltr; }
.speak-row { display: flex; justify-content: center; gap: 8px; margin: -10px 0 18px; flex-wrap: wrap; }
.word.done { opacity: .65; border-inline-start-color: var(--good); }
.examples { display: grid; gap: 8px; }
.ex { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--paper); }
.ex .en { font-size: 16px; line-height: 1.5; font-weight: 500; text-align: left; }
.ex .ar { color: var(--muted); font-size: 15px; }
.ex-det summary { cursor: pointer; margin: 12px 0 8px; color: var(--accent); font-weight: 500; }
.q-word.rtl { direction: rtl; }
.q-sub { text-align: center; font-size: 26px; font-weight: 600; margin: -8px 0 18px; }
.q-sent { text-align: center; font-size: 22px; line-height: 1.6; font-weight: 600; margin: 10px 0 6px; }
.type-in { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--paper); font-family: inherit; font-size: 22px; text-align: center; color: var(--ink); margin-bottom: 4px; }
.type-in.right { border-color: var(--good); background: var(--good-soft); }
.type-in.wrong { border-color: var(--bad); background: var(--bad-soft); }
.recap { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; color: var(--muted); flex-wrap: wrap; }
.recap .en { font-weight: 600; color: var(--ink); }
.listen-row { display: flex; justify-content: center; gap: 10px; margin: 10px 0 22px; flex-wrap: wrap; }
.listen-row .spk { height: 52px; font-size: 20px; padding: 0 22px; }
.save-box { margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--accent); border-radius: 12px; background: var(--accent-soft); }
.save-q { margin: 0 0 10px; font-weight: 500; }
.save-msg { margin: 0; font-weight: 500; }
.save-msg.ok { color: var(--good); }
.pick { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 6px; cursor: pointer; }
.pick input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.pick .pw { font-weight: 600; }
.pick .pa { color: var(--muted); }
.pick.saved { opacity: .6; cursor: default; }
.btns { display: flex; gap: 6px; flex: none; }
.spk.del { color: var(--bad); }
.hidden-view { display: none; }
.src-tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-inline-start: 8px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">ترجمان<small>ترجم، وبعدين اختبر نفسك على الكلمات</small></h1>
    <button class="theme-btn" id="themeBtn" aria-label="تغيير الوضع الليلي">◐</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabTr" aria-selected="true" aria-controls="viewTr">ترجمة</button>
    <button role="tab" id="tabHi" aria-selected="false" aria-controls="viewHi">السجل والأسئلة<span class="count" id="histCount">0</span></button>
  </nav>

  <main>
    <section id="viewTr" role="tabpanel" aria-labelledby="tabTr">
      <div class="card">
        <div class="dir-row"><span>الاتجاه:</span><span class="dir-badge" id="dirBadge">عربي ← إنجليزي</span><span class="hint">يتحدد تلقائياً</span></div>
        <textarea id="input" dir="auto" maxlength="450" placeholder="اكتب كلمة أو جملة بالعربي أو الإنجليزي… والترجمة تطلع لك مباشرة" aria-label="النص المراد ترجمته"></textarea>
        <div class="row">
          <button class="btn primary" id="goBtn">ترجم</button>
          <button class="btn" id="clearBtn">مسح</button>
          <span class="hint grow" id="counter"></span>
          <span class="hint" id="liveState" aria-live="polite"></span>
          <span class="hint" id="netState"></span>
        </div>
        <div id="resultBox" class="result" aria-live="polite"></div>
      </div>

      <div class="card" id="offlineCard">
        <h2 style="margin:0 0 6px;font-size:18px">ترجمة كاملة بدون إنترنت (الأفضل جودة)</h2>
        <p class="hint" style="margin:0 0 10px">نزّل نموذج الترجمة مرة وحدة وأنت متصل (حجمه حوالي 150 ميجا للاتجاهين). الترجمة بعدها تصير أفضل وأدق من الأونلاين، وتشتغل بدون إنترنت.</p>
        <div class="row" style="margin-top:0"><button class="btn primary" id="dlBtn">نزّل نموذج الترجمة</button><span class="hint" id="dlState"></span></div>
        <div class="row" style="margin-top:8px"><button class="btn small danger" id="clearCacheBtn">مسح كاش الترجمات القديمة</button><span class="hint" id="cacheState"></span></div>
      </div>
    </section>

    <section id="viewHi" role="tabpanel" aria-labelledby="tabHi" class="hidden-view">
      <div id="quizBox"></div>
      <div class="sec-title"><h2>سجل الترجمات</h2><button class="btn small danger" id="wipeBtn">حذف الكل</button></div>
      <p class="hint" id="syncState" style="margin-top:-4px"></p>
      <div id="masteredRow" class="row" style="margin:0 0 10px"></div>
      <div class="row" style="margin:0 0 10px"><button class="btn small" id="exportBtn">تصدير نسخة احتياطية</button><button class="btn small" id="importBtn">استيراد نسخة احتياطية</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
      <div id="histList"></div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") el.className = attrs[k];
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
    }
    for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
    return el;
  }
  const isArabic = (s) => /[\u0600-\u06FF]/.test(s);
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const norm = (s) => String(s).trim().toLowerCase();

  /* ---------- pronunciation ---------- */
  const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
  let enVoice = null;
  function pickVoice() {
    if (!canSpeak) return;
    const vs = speechSynthesis.getVoices();
    enVoice = vs.find((v) => /^en[-_]US/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
  }
  if (canSpeak) { pickVoice(); if (speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", pickVoice); }
  function speak(t, slow) {
    if (!canSpeak || !t) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US"; if (enVoice) u.voice = enVoice;
    u.rate = slow ? 0.55 : 0.9;
    speechSynthesis.speak(u);
  }
  function speakBtn(t, label, slow) {
    if (!canSpeak) return null;
    return h("button", { class: "spk" + (label ? " lbl" : ""), type: "button", title: "استمع للنطق", "aria-label": "استمع لنطق: " + t, onclick: (ev) => { ev.stopPropagation(); speak(t, slow); } },
      slow ? "🐢" : "🔊", label ? h("span", null, label) : null);
  }

  /* ---------- storage ---------- */
  const HKEY = "tarjuman:history:v1", SKEY = "tarjuman:stats:v1";
  let memH = [], memS = {};
  function read(key, fallback, mem) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return mem; }
  }
  function write(key, val, setMem) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { setMem(val); }
  }
  let history = read(HKEY, [], memH);
  let stats = read(SKEY, {}, memS);
  const saveHistory = () => write(HKEY, history, (v) => (memH = v));
  const saveStats = () => write(SKEY, stats, (v) => (memS = v));
  function setSync(t) { const el = document.getElementById("syncState"); if (el) el.textContent = t; }

  /* ---------- theme ---------- */
  $("themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });

  /* ---------- tabs ---------- */
  function showTab(name) {
    const tr = name === "tr";
    $("tabTr").setAttribute("aria-selected", tr);
    $("tabHi").setAttribute("aria-selected", !tr);
    $("viewTr").classList.toggle("hidden-view", !tr);
    $("viewHi").classList.toggle("hidden-view", tr);
    if (!tr) { renderList(); startRound(null); }
    window.scrollTo({ top: 0 });
  }
  $("tabTr").addEventListener("click", () => showTab("tr"));
  $("tabHi").addEventListener("click", () => showTab("hi"));
  function updateCount() { $("histCount").textContent = history.length; }

  /* ---------- translate ---------- */
  const input = $("input"), goBtn = $("goBtn");
  let reqSeq = 0, liveTimer = null, ctrl = null, lastId = null, denied = false, pauseUntil = 0;

  function currentDir() { return isArabic(input.value) ? "ar-en" : "en-ar"; }
  function updateDir() {
    $("dirBadge").textContent = currentDir() === "ar-en" ? "عربي ← إنجليزي" : "إنجليزي ← عربي";
    $("counter").textContent = input.value.length ? input.value.length + " / 450" : "";
  }
  function stopLive() { clearTimeout(liveTimer); reqSeq++; if (ctrl) ctrl.abort(); $("liveState").textContent = ""; }

  input.addEventListener("input", () => {
    updateDir();
    clearTimeout(liveTimer);
    const t = input.value.trim();
    if (!t) { stopLive(); lastId = null; $("resultBox").replaceChildren(); return; }
    if (t.length < 2 || denied || Date.now() < pauseUntil) return;
    liveTimer = setTimeout(() => doTranslate(true), 900);
  });
  input.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { clearTimeout(liveTimer); doTranslate(false); } });
  $("clearBtn").addEventListener("click", () => { input.value = ""; stopLive(); lastId = null; $("resultBox").replaceChildren(); updateDir(); input.focus(); });
  goBtn.addEventListener("click", () => { clearTimeout(liveTimer); doTranslate(false); });

  function showError(msg) { $("resultBox").replaceChildren(h("div", { class: "err", role: "alert" }, msg)); }

  /* ---------- online translation sources ---------- */
  const STOP = new Set(("a an the and or but if of to in on at by for with from as is am are was were be been being it its this that these those i you he she we they me him her us them my your his our their do does did have has had will would can could should may might not no so than then there here what which who whom when where why how into out up down over under about very just also").split(" "));
  const isAbort = (e) => e && e.name === "AbortError";

  // Google Translate (unofficial, works well for Arabic, most reliable)
  async function googleTranslate(text, dir, signal) {
    const sl = dir === "ar-en" ? "ar" : "en";
    const tl = dir === "ar-en" ? "en" : "ar";
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
    const r = await fetch(url, { signal });
    if (!r.ok) throw new Error("net");
    const j = await r.json();
    if (!j || !j[0] || !Array.isArray(j[0])) throw new Error("bad");
    return j[0].map(x => x && x[0] ? x[0] : "").join("").trim();
  }

  // MyMemory (backup)
  async function mm(q, pair, signal) {
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) + "&langpair=" + pair;
    const r = await fetch(url, { signal });
    if (r.status === 429) throw new Error("quota");
    if (!r.ok) throw new Error("net");
    const j = await r.json();
    const t = j && j.responseData && j.responseData.translatedText;
    if (!t || j.quotaFinished || /MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(t)) throw new Error("quota");
    return String(t).replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, "&").trim();
  }

  async function onlineTranslate(text, dir, signal) {
    const src = text.slice(0, 450);
    // Try Google first
    try {
      const translation = await googleTranslate(src, dir, signal);
      if (translation) return await enrichWords(text, dir, translation, signal, "Google Translate");
    } catch (e) { if (isAbort(e)) throw e; }
    // Fallback to MyMemory
    const translation = await mm(src, dir === "ar-en" ? "ar|en" : "en|ar", signal);
    return await enrichWords(text, dir, translation, signal, "MyMemory");
  }

  // Given a translation, extract words + examples
  async function enrichWords(text, dir, translation, signal, sourceName) {
    const enText = dir === "ar-en" ? translation : text;
    const toks = (enText.toLowerCase().match(/[a-z][a-z'-]*/g) || []).map((w) => w.replace(/^['-]+|['-]+$/g, "")).filter(Boolean);
    const single = toks.length === 1;
    const seen = new Set(), picked = [];
    for (const t of toks) {
      if (seen.has(t)) continue;
      seen.add(t);
      if (!single && (STOP.has(t) || t.length < 3)) continue;
      picked.push(t);
    }
    const top = picked.slice(0, 4);

    const wordsP = (async () => {
      if (single) return [{ en: top[0], ar: dir === "en-ar" ? translation : text.trim() }];
      const out = await Promise.all(top.map(async (w) => {
        try {
          const ar = await googleTranslate(w, "en-ar", signal).catch(() => mm(w, "en|ar", signal));
          return ar && !/[a-z]/i.test(ar) ? { en: w, ar } : null;
        } catch (e) { if (isAbort(e)) throw e; return null; }
      }));
      return out.filter(Boolean);
    })();

    const examplesP = (async () => {

  const MODEL_LIB = "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
  const MODELS = { "en-ar": "Xenova/opus-mt-en-ar", "ar-en": "Xenova/opus-mt-ar-en" };

  async function getLib() {
    if (!tfLib) { tfLib = await import(MODEL_LIB); tfLib.env.allowLocalModels = false; }

  async function getPipe(dir, onProgress) {
    if (!pipes[dir]) {
      const L = await getLib();
      pipes[dir] = L.pipeline("translation", MODELS[dir], onProgress ? { progress_callback: onProgress } : {});
      pipes[dir].catch(() => { delete pipes[dir]; });
    }
    return pipes[dir];
  }
  async function modelTranslate(text, dir) {
    const p = await getPipe(dir);

  async function modelFallback(text, dir) {
    const translation = await modelTranslate(text, dir);
    if (!translation) return null;
    const enText = dir === "ar-en" ? translation : text;
    const toks = (enText.toLowerCase().match(/[a-z][a-z'-]*/g) || []).map((w) => w.replace(/^['-]+|['-]+$/g, "")).filter(Boolean);
    const single = toks.length === 1;
    const seen = new Set(), top = [];
    for (const t of toks) {
      if (seen.has(t)) continue;
      seen.add(t);
      if (!single && (STOP.has(t) || t.length < 3)) continue;
      top.push(t);
      if (top.length >= 4) break;
    }
    const words = [];
    if (single) words.push({ en: top[0], ar: dir === "en-ar" ? translation : text.trim() });
    else {
      for (const w of top) {
        let ar = EN2AR[w] ? EN2AR[w].split("،")[0] : "";
        if (!ar) { try { ar = await modelTranslate(w, "en-ar"); } catch (e) { ar = ""; } }
        if (ar && !/[a-z]/i.test(ar)) words.push({ en: w, ar });
      }
    }
    const examples = toks.length >= 3 ? [{ en: enText.slice(0, 200), ar: dir === "ar-en" ? text : translation }] : [];
    return { translation, words, examples, note: "من النموذج على جهازك (بدون إنترنت)" };
  }

  /* ---------- MAIN TRANSLATE (FIXED PRIORITY) ---------- */
  async function doTranslate(auto) {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    const dir = currentDir();
    const my = ++reqSeq;
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    const signal = ctrl.signal;
    if (!auto) { denied = false; goBtn.disabled = true; }
    $("liveState").textContent = "جاري الترجمة…";
    try {
      let data = cacheGet(text, dir), netErr = null;

      if (!data) {
        // 1) النموذج على الجهاز أولاً (الأدق)
        if (modelReady[dir]) {
          $("liveState").textContent = "جاري الترجمة بالنموذج على جهازك…";
          try { data = await modelFallback(text, dir); } catch (e) { data = null; }
        }
        // 2) الأونلاين (Google ثم MyMemory)
        if (!data && navigator.onLine !== false) {
          $("liveState").textContent = "جاري الترجمة أونلاين…";
          try { data = await onlineTranslate(text, dir, signal); cachePut(text, dir, data); refreshCacheUI(); }
          catch (e) { if (isAbort(e)) throw e; netErr = e; }
        }
        // 3) القاموس المدمج
        if (!data) data = dictGet(text, dir);
        if (!data && netErr && netErr.message === "quota") throw netErr;
      }
      if (my !== reqSeq) return;
      if (!data) { offlineMiss(text, dir); return; }
      const translation = String(data.translation || "").trim();
      if (!translation) { showError("ما قدرت أترجم هذا النص. جرّب تكتبه بشكل ثاني."); return; }

      const words = [];
      const seen = new Set();
      for (const w of Array.isArray(data.words) ? data.words : []) {
        if (!w || typeof w.en !== "string" || typeof w.ar !== "string") continue;
        const en = w.en.trim(), ar = w.ar.trim();
        if (!en || !ar || seen.has(norm(en))) continue;
        seen.add(norm(en)); words.push({ en, ar });
      }
      const examples = [];
      for (const x of Array.isArray(data.examples) ? data.examples : []) {
        if (!x || typeof x.en !== "string" || typeof x.ar !== "string") continue;
        const en = x.en.trim(), ar = x.ar.trim();
        if (en && ar && examples.length < 3) examples.push({ en, ar });
      }

      const entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), dir, text, translation, words, examples, note: data.note || "" };
      renderResult(entry);
    } catch (err) {
      if (my !== reqSeq) return;
      if (err && err.message === "quota") { pauseUntil = Date.now() + 15000; showError("وصلت الحد المجاني. انتظر شوي وجرّب، أو نزّل النموذج عشان تشتغل بدون قيود."); }
      else if (err && err.code === "not_granted") { denied = true; showError("لازم توافق على صلاحية الترجمة."); }
      else if (err && err.code === "rate_limited") { pauseUntil = Date.now() + 10000; showError("طلبات كثيرة بسرعة. انتظر شوي."); }
      else showError("صار خطأ أثناء الترجمة. تأكد من الإنترنت واضغط «ترجم».");
    } finally {
      if (my === reqSeq) $("liveState").textContent = "";
      goBtn.disabled = false;
    }
  }

  function wordCards(words, onDelete) {
    return h("div", { class: "words" }, words.map((w) => {
      const btns = h("div", { class: "btns" }, speakBtn(w.en),
        onDelete ? h("button", { class: "spk del", type: "button", title: "احذف الكلمة", "aria-label": "احذف الكلمة " + w.en, onclick: () => onDelete(w) }, "✕") : null);
      return h("div", { class: "word" + (isMastered(w) ? " done" : "") },
        h("div", { class: "en-row" }, h("div", { class: "en", dir: "ltr" }, w.en), btns),
        h("div", { class: "ar" }, w.ar + (isMastered(w) ? "  ✓ متقنة" : "")));
    }));
  }

  function exampleList(ex) {
    return h("div", { class: "examples" }, ex.map((x) =>
      h("div", { class: "ex" }, h("div", { class: "en-row" }, h("div", { class: "en", dir: "ltr" }, x.en), speakBtn(x.en)), h("div", { class: "ar" }, x.ar))));
  }

  function findSaved(e) { return history.find((x) => norm(x.text) === norm(e.text) && x.dir === e.dir) || null; }

  function savePrompt(e) {
    const wrap = h("div", { class: "save-box" });
    const done = (msg, ok) => wrap.replaceChildren(h("p", { class: "save-msg" + (ok ? " ok" : "") }, msg));
    const existing = findSaved(e);
    const isSentence = /\s/.test(e.text.trim());
    const showText = isSentence || e.words.length === 0;
    const textSaved = !!(existing && !existing.noText);
    const savedHas = (w) => !!(existing && existing.words.some((x) => norm(x.en) === norm(w.en)));

    const rows = e.words.map((w) => {
      const saved = savedHas(w);
      const box = h("input", { type: "checkbox", checked: true, disabled: saved });
      const row = h("label", { class: "pick" + (saved ? " saved" : "") }, box,
        h("span", { class: "pw", dir: "ltr" }, w.en), h("span", { class: "pa" }, "= " + w.ar + (saved ? "  (محفوظة)" : "")));
      return { w, box, row, saved };
    });
    let textBox = null, textRow = null;
    if (showText) {
      textBox = h("input", { type: "checkbox", checked: true, disabled: textSaved });
      textRow = h("label", { class: "pick pick-text" + (textSaved ? " saved" : "") }, textBox,
        h("span", { class: "pa" }, "النص كامل: " + (e.text.length > 60 ? e.text.slice(0, 60) + "…" : e.text) + (textSaved ? "  (محفوظ)" : "")));
    }
    const nothingNew = rows.every((r) => r.saved) && (!showText || textSaved);
    if (existing && nothingNew) { done("✓ محفوظة في السجل.", true); return wrap; }

    const save = () => {
      const chosen = rows.filter((r) => !r.saved && r.box.checked).map((r) => r.w);
      const wantText = showText ? (!textSaved && textBox.checked) : chosen.length > 0;
      if (!chosen.length && !wantText) { done("ما اخترت شي.", false); return; }
      if (existing) {
        chosen.forEach((w) => existing.words.push(w));
        if (wantText) existing.noText = false;
        if (!(existing.examples && existing.examples.length) && e.examples) existing.examples = e.examples;
      } else {
        history.unshift(Object.assign({}, e, { words: chosen, noText: showText ? !textBox.checked : false }));
      }
      if (history.length > 200) history.length = 200;
      saveHistory(); updateCount();
      done("✓ انحفظ في السجل" + (chosen.length ? " (" + chosen.length + " كلمة)" : ""), true);
    };

    wrap.append(
      h("p", { class: "save-q" }, "اختر اللي تبي تحفظه في السجل عشان أسألك عنه:"),
      ...rows.map((r) => r.row), ...(textRow ? [textRow] : []),
      h("div", { class: "row", style: "margin-top:8px" },
        h("button", { class: "btn primary", onclick: save }, "احفظ المحدد"),
        h("button", { class: "btn", onclick: () => done("تمام، ما انحفظ شي.", false) }, "لا")));
    return wrap;
  }

  function renderResult(e) {
    const outDir = e.dir === "ar-en" ? "ltr" : "rtl";
    const enText = e.dir === "ar-en" ? e.translation : e.text;
    const copyBtn = h("button", { class: "btn small", onclick: async () => {
      try { await navigator.clipboard.writeText(e.translation); copyBtn.textContent = "تم النسخ"; }
      catch (x) { copyBtn.textContent = "ما اننسخ"; }
      setTimeout(() => (copyBtn.textContent = "نسخ"), 1500);
    } }, "نسخ");
    const box = $("resultBox");
    const noteEl = e.note ? h("p", { class: "hint" }, h("span", { class: "src-tag" }, e.note)) : null;
    box.replaceChildren(
      h("p", { class: "out", dir: outDir }, e.translation),
      h("div", { class: "row" }, copyBtn, speakBtn(enText, "انطق الإنجليزي"), speakBtn(enText, "ببطء", true)),
      savePrompt(e),
      noteEl
    );
    if (e.words.length) box.append(h("p", { class: "words-title" }, "الكلمات"), wordCards(e.words));
    if (e.examples && e.examples.length) box.append(h("p", { class: "words-title" }, "أمثلة"), exampleList(e.examples));
  }

  /* ---------- vocabulary pool ---------- */
  const MASTER = 30;
  const streakOf = (w) => ((stats[norm(w.en)] || {}).s) || 0;
  const isMastered = (w) => streakOf(w) >= MASTER;
  function pool(scopeId, includeMastered) {
    const src = scopeId ? history.filter((x) => x.id === scopeId) : history;
    const map = new Map();
    for (const e of src) for (const w of e.words) if (!map.has(norm(w.en))) map.set(norm(w.en), w);
    const all = [...map.values()];
    return includeMastered ? all : all.filter((w) => !isMastered(w));
  }

  /* ---------- quiz ---------- */
  let quiz = null;
  const TRUE_ = "صح", FALSE_ = "غلط";
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const squash = (s) => String(s).trim().toLowerCase().replace(/\s+/g, " ").replace(/[.!?,;:]+$/, "");

  function exampleFor(w) {
    const re = new RegExp("\\b" + esc(w.en) + "\\b", "i");
    const hits = [];
    for (const e of history) for (const x of (e.examples || [])) if (re.test(x.en)) hits.push(x);
    return hits.length ? hits[Math.floor(Math.random() * hits.length)] : null;
  }
  function distract(w, all, key, n) {
    const out = [];
    for (const o of shuffle(all)) {
      if (norm(o.en) === norm(w.en) || norm(o.ar) === norm(w.ar)) continue;
      if (out.some((u) => norm(u) === norm(o[key]))) continue;
      out.push(o[key]);
      if (out.length >= n) break;
    }
    return out;
  }
  function typesFor(w, all) {
    if (all.length < 4) return ["flip", "type"];
    const t = ["mc_ar", "mc_ar", "mc_en", "tf", "type"];
    if (canSpeak) t.push("listen", "listen");
    if (exampleFor(w)) t.push("fill", "fill", "fill");
    return t;
  }
  function buildQ(w, all) {
    const types = typesFor(w, all);
    const type = types[Math.floor(Math.random() * types.length)];
    const q = { w, type };
    if (type === "mc_ar" || type === "listen") { q.answer = w.ar; q.options = shuffle([w.ar, ...distract(w, all, "ar", 3)]); }
    else if (type === "mc_en") { q.answer = w.en; q.options = shuffle([w.en, ...distract(w, all, "en", 3)]); }
    else if (type === "fill") {
      const x = exampleFor(w);
      q.ex = x;
      q.blanked = x.en.replace(new RegExp("\\b" + esc(w.en) + "\\b", "i"), "_____");
      q.answer = w.en; q.options = shuffle([w.en, ...distract(w, all, "en", 3)]);
    } else if (type === "tf") {
      const other = distract(w, all, "ar", 1)[0];
      const truth = !other || Math.random() < 0.5;
      q.shownAr = truth ? w.ar : other;
      q.answer = truth ? TRUE_ : FALSE_;
      q.options = [TRUE_, FALSE_];
    } else { q.answer = type === "type" ? w.en : w.ar; }
    return q;
  }
  function startRound(scopeId) {
    const words = pool(scopeId);
    const all = pool(null, true);
    if (!words.length) { quiz = null; renderQuiz(); return; }
    const ranked = shuffle(words).slice(0, 10);
    const qs = shuffle(ranked).map((w) => buildQ(w, all));
    quiz = { qs, i: 0, score: 0, missed: [], answered: false, scopeId, picked: null, flipped: false, typed: "", lastOk: false, lastMastered: false };
    renderQuiz();
  }
  function record(word, ok) {
    const k = norm(word.en);
    const s = stats[k] || { r: 0, w: 0, s: 0 };
    if (ok) { s.r++; s.s = (s.s || 0) + 1; } else { s.w++; s.s = 0; }
    stats[k] = s; saveStats();
    quiz.lastMastered = ok && s.s >= MASTER;
    if (!ok) quiz.missed.push(word); else quiz.score++;
  }
  function finish(ok, picked) {
    if (!quiz || quiz.answered) return;
    quiz.answered = true; quiz.lastOk = ok; quiz.picked = picked == null ? null : picked;
    record(quiz.qs[quiz.i].w, ok); renderQuiz();
  }
  function nextQ() { quiz.i++; quiz.answered = false; quiz.picked = null; quiz.flipped = false; quiz.typed = ""; renderQuiz(); }

  function optionsBlock(q, ltr) {
    const opts = h("div", { class: "opts" });
    q.options.forEach((o) => {
      const b = h("button", { class: "opt", type: "button", dir: ltr ? "ltr" : null, disabled: quiz.answered, onclick: () => finish(squash(o) === squash(q.answer), o) }, o);
      if (quiz.answered) { if (squash(o) === squash(q.answer)) b.classList.add("right"); else if (quiz.picked === o) b.classList.add("wrong"); }
      opts.append(b);
    });
    return opts;
  }

  function renderQuestion(card, q) {
    const w = q.w;
    const label = (t) => h("p", { class: "q-label" }, t);
    switch (q.type) {
      case "mc_ar": card.append(label("ويش معنى هذي الكلمة بالعربي؟"), h("div", { class: "q-word", dir: "ltr" }, w.en), h("div", { class: "speak-row" }, speakBtn(w.en, "استمع للنطق")), optionsBlock(q, false)); break;
      case "mc_en": card.append(label("ويش الكلمة بالإنجليزي لهذا المعنى؟"), h("div", { class: "q-word rtl" }, w.ar), optionsBlock(q, true)); break;
      case "listen": card.append(label("استمع للكلمة… ويش معناها بالعربي؟"), h("div", { class: "listen-row" }, speakBtn(w.en, "استمع"), speakBtn(w.en, "ببطء", true)), optionsBlock(q, false)); break;
      case "tf": card.append(label("الكلمة ومعناها… صح ولا غلط؟"), h("div", { class: "q-word", dir: "ltr" }, w.en), h("div", { class: "q-sub" }, "= " + q.shownAr), optionsBlock(q, false)); break;
      case "fill": card.append(label("اختر الكلمة الناقصة في الجملة"), h("div", { class: "q-sent", dir: "ltr" }, q.blanked), h("p", { class: "hint center", style: "margin:0 0 16px" }, q.ex.ar), optionsBlock(q, true)); break;
      case "type": {
        const inp = h("input", { type: "text", class: "type-in" + (quiz.answered ? (quiz.lastOk ? " right" : " wrong") : ""), dir: "ltr",
          autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "اكتب هنا…", disabled: quiz.answered,
          value: quiz.typed || "", "aria-label": "اكتب الكلمة بالإنجليزي" });
        const submit = () => { if (quiz.answered || !inp.value.trim()) return; quiz.typed = inp.value; finish(squash(inp.value) === squash(q.answer), inp.value); };
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
        card.append(label("اكتب الكلمة بالإنجليزي لهذا المعنى"), h("div", { class: "q-word rtl" }, w.ar), inp);
        if (!quiz.answered) card.append(h("div", { class: "row", style: "justify-content:center" }, h("button", { class: "btn primary", onclick: submit }, "تحقق")));
        break;
      }
      default:
        card.append(label("ويش معنى هذي الكلمة بالعربي؟"), h("div", { class: "q-word", dir: "ltr" }, w.en), h("div", { class: "speak-row" }, speakBtn(w.en, "استمع للنطق")),
          h("div", { class: "reveal" + (quiz.flipped ? "" : " hidden") }, quiz.flipped ? w.ar : "فكّر بالمعنى، وبعدين اضغط «اعرض المعنى»"));
        if (!quiz.flipped) card.append(h("div", { class: "center" }, h("button", { class: "btn primary", onclick: () => { quiz.flipped = true; renderQuiz(); } }, "اعرض المعنى")));
        else if (!quiz.answered) card.append(h("div", { class: "row", style: "justify-content:center" },
          h("button", { class: "btn", onclick: () => finish(true) }, "كنت أعرفها"),
          h("button", { class: "btn", onclick: () => finish(false) }, "ما كنت أعرفها")));
        if (!quiz.answered) card.append(h("p", { class: "hint center" }, "لما تترجم 4 كلمات مختلفة أو أكثر، تظهر أنواع أسئلة أخرى."));
    }
  }

  function renderQuiz() {
    const box = $("quizBox");
    if (!quiz) {
      const hasMastered = pool(null, true).length > 0;
      box.replaceChildren(h("div", { class: "card empty" },
        h("b", null, hasMastered ? "ما بقى كلمات للأسئلة 🎉" : "ما عندك كلمات للاختبار بعد"),
        hasMastered ? "كل الكلمات هنا صارت متقنة. ترجم جمل جديدة، أو رجّع الكلمات المتقنة من تحت." : "ترجم كلمة أو جملة بالإنجليزي، والكلمات المهمة فيها تنحفظ هنا وأسألك عنها."));
      return;
    }
    if (quiz.i >= quiz.qs.length) { renderDone(box); return; }

    const q = quiz.qs[quiz.i], w = q.w;
    const pct = Math.round((quiz.i / quiz.qs.length) * 100);
    const card = h("div", { class: "card quiz" },
      h("h2", null, "اختبر نفسك"),
      h("div", { class: "meta" }, h("span", null, "سؤال " + (quiz.i + 1) + " من " + quiz.qs.length), h("span", null, "الصح: " + quiz.score)),
      h("div", { class: "bar", "aria-hidden": "true" }, h("i", { style: "width:" + pct + "%" })));
    renderQuestion(card, q);

    if (quiz.answered) {
      const ok = quiz.lastOk;
      const okMsg = quiz.lastMastered
        ? "صح! 🎉 جاوبتها " + MASTER + " مرة ورا بعض. تثبّتت."
        : "صح! 👏 (" + streakOf(w) + " من " + MASTER + " ورا بعض)";
      const wrongMsg = q.type === "tf" ? "غلط. الصحيح: " + w.en + " = " + w.ar : "غلط. الجواب الصحيح: " + (q.answer || w.ar);
      card.append(h("div", { class: "feedback " + (ok ? "good" : "bad") }, ok ? okMsg : wrongMsg));
      card.append(h("div", { class: "recap" }, h("span", { class: "en", dir: "ltr" }, w.en), "=", h("span", null, w.ar), speakBtn(w.en)));
      card.append(h("div", { class: "row", style: "justify-content:center" },
        h("button", { class: "btn primary", onclick: nextQ }, quiz.i + 1 >= quiz.qs.length ? "شوف النتيجة" : "السؤال التالي")));
    }
    box.replaceChildren(card);
    if (q.type === "listen" && !quiz.answered && !q.spoken) { q.spoken = true; speak(w.en, false); }
    if (q.type === "type" && !quiz.answered) { const el = box.querySelector(".type-in"); if (el) el.focus(); }
  }

  function renderDone(box) {
    const total = quiz.qs.length;
    const scope = quiz.scopeId;
    const card = h("div", { class: "card quiz" },
      h("h2", { class: "center" }, "خلصت الجولة"),
      h("div", { class: "score" }, quiz.score + " / " + total),
      h("p", { class: "center hint" }, quiz.score === total ? "ممتاز! عرفت كل الكلمات." : "راجع الكلمات اللي غلطت فيها وأعد الجولة."));
    if (quiz.missed.length) card.append(h("div", { class: "missed" }, h("p", { class: "words-title" }, "كلمات تحتاج مراجعة"), wordCards(quiz.missed)));
    card.append(h("div", { class: "row", style: "justify-content:center" },
      h("button", { class: "btn primary", onclick: () => startRound(scope) }, "جولة جديدة"),
      scope ? h("button", { class: "btn", onclick: () => startRound(null) }, "اختبار من كل الكلمات") : null));
    box.replaceChildren(card);
  }

  /* ---------- history list ---------- */
  function removeWord(e, w) {
    e.words = e.words.filter((x) => x !== w);
    if (!e.words.length && e.noText) history = history.filter((x) => x.id !== e.id);
    const k = norm(w.en);
    if (!pool(null, true).some((x) => norm(x.en) === k)) { delete stats[k]; saveStats(); }
    saveHistory(); updateCount(); renderList(); startRound(null);
  }

  function renderList() {
    const list = $("histList");
    $("wipeBtn").style.display = history.length ? "" : "none";
    const mastered = pool(null, true).filter(isMastered);
    $("masteredRow").replaceChildren(...(mastered.length ? [
      h("span", { class: "hint" }, "كلمات متقنة ما تنسأل عنها: " + mastered.length),
      h("button", { class: "btn small", onclick: () => { mastered.forEach((w) => { const k = norm(w.en); if (stats[k]) stats[k].s = 0; }); saveStats(); renderList(); startRound(null); } }, "رجّعها للأسئلة")
    ] : []));
    if (!history.length) {
      list.replaceChildren(h("div", { class: "card empty" }, h("b", null, "السجل فاضي"), "الترجمات اللي تسويها بتظهر هنا."));
      return;
    }
    list.replaceChildren(...history.map((e) => {
      const fromDir = e.dir === "ar-en" ? "rtl" : "ltr", toDir = e.dir === "ar-en" ? "ltr" : "rtl";
      const d = new Date(e.ts);
      return h("article", { class: "card entry" },
        e.noText ? null : h("div", { class: "tx" }, h("div", { class: "a", dir: fromDir }, e.text), h("div", { class: "b", dir: toDir }, e.translation)),
        e.words.length ? wordCards(e.words, (w) => removeWord(e, w)) : h("p", { class: "hint" }, "ما فيه كلمات محفوظة لهذي الترجمة."),
        e.examples && e.examples.length ? h("details", { class: "ex-det" }, h("summary", null, "أمثلة (" + e.examples.length + ")"), exampleList(e.examples)) : null,
        h("div", { class: "tools" },
          e.noText ? null : speakBtn(e.dir === "ar-en" ? e.translation : e.text, "انطق"),
          e.words.length ? h("button", { class: "btn small primary", onclick: () => { startRound(e.id); window.scrollTo({ top: 0, behavior: "smooth" }); } }, "اختبرني على هذي") : null,
          h("button", { class: "btn small danger", onclick: () => { history = history.filter((x) => x.id !== e.id); saveHistory(); updateCount(); renderList(); startRound(null); } }, "حذف"),
          h("time", { datetime: d.toISOString() }, d.toLocaleDateString("ar", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" }))));
    }));
  }

  $("wipeBtn").addEventListener("click", () => {
    if (!confirm("تبي تحذف كل السجل والكلمات؟")) return;
    history = []; stats = {}; saveHistory(); saveStats(); updateCount(); renderList(); startRound(null);
  });

  /* ---------- backup ---------- */
  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app: "tarjuman", history: history, stats: stats, exported: Date.now() })], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob); link.download = "tarjuman-backup.json";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  });
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      const inc = Array.isArray(d.history) ? d.history : [];
      const byId = new Map();
      for (const e of [].concat(inc, history)) if (e && e.id && !byId.has(e.id)) byId.set(e.id, e);
      history = [...byId.values()].sort((x, y) => y.ts - x.ts).slice(0, 300);
      const st = d.stats && typeof d.stats === "object" ? d.stats : {};
      for (const k in st) { const cur = stats[k], inn = st[k]; if (!cur || (inn.r + inn.w) > (cur.r + cur.w)) stats[k] = inn; }
      saveHistory(); saveStats(); updateCount(); renderList(); startRound(null);
      setSync("تم استيراد " + inc.length + " ترجمة ✓");
    } catch (err) { setSync("ملف النسخة الاحتياطية غير صالح"); }
  });

  /* ---------- init ---------- */
  updateCount(); updateDir(); updNet(); refreshModelUI(); refreshCacheUI();
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
