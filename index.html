<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترجمان — أفضل مترجم مجاني</title>
<style>
/* ... (نفس التنسيقات السابقة، لم أغيّرها لضمان عدم كسر الواجهة) ... */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --paper: #EAF1F2; --surface: #FFFFFF; --ink: #0E2A33; --muted: #5A6F77; --line: #CFDCDF; --accent: #0E7C86; --accent-ink: #FFFFFF; --accent-soft: #D7ECEE; --good: #1B8A4B; --good-soft: #D8F0E2; --bad: #C2383B; --bad-soft: #F8DEDF; --font: "Readex Pro", system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #0A181D; --surface: #11262D; --ink: #E7F1F3; --muted: #93AAB2; --line: #234049; --accent: #4FC3CC; --accent-ink: #062228; --accent-soft: #14383F; --good: #55D08A; --good-soft: #15382A; --bad: #FF8587; --bad-soft: #432024; } }
:root[data-theme="dark"] { --paper: #0A181D; --surface: #11262D; --ink: #E7F1F3; --muted: #93AAB2; --line: #234049; --accent: #4FC3CC; --accent-ink: #062228; --accent-soft: #14383F; --good: #55D08A; --good-soft: #15382A; --bad: #FF8587; --bad-soft: #432024; }
*, *::before, *::after { box-sizing: inherit; } html { scroll-padding-top: env(safe-area-inset-top, 0px); } body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.7; -webkit-font-smoothing: antialiased; } button, textarea { font: inherit; color: inherit; } button { cursor: pointer; } :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; } .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; } header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; } .brand { font-weight: 700; font-size: 30px; letter-spacing: 0; margin: 0; line-height: 1.2; } .brand small { display: block; font-weight: 300; font-size: 14px; color: var(--muted); margin-top: 2px; } .theme-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 42px; height: 42px; display: grid; place-items: center; } nav.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 5px; margin-bottom: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 5; } nav.tabs button { border: 0; background: transparent; border-radius: 10px; padding: 10px 8px; font-weight: 500; color: var(--muted); } nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); } .count { display: inline-block; min-width: 1.6em; padding: 0 6px; margin-inline-start: 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; } nav.tabs button[aria-selected="true"] .count { background: rgba(255,255,255,.22); color: var(--accent-ink); } .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; } .card + .card { margin-top: 14px; } .dir-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: var(--muted); font-size: 15px; } .dir-badge { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 14px; font-weight: 500; } textarea { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--paper); font-size: 20px; line-height: 1.6; } textarea::placeholder { color: var(--muted); } .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; } .row .grow { flex: 1; } .hint { color: var(--muted); font-size: 14px; } .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 18px; font-weight: 500; } .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .btn.primary:disabled { opacity: .55; cursor: progress; } .btn.small { padding: 5px 12px; font-size: 14px; border-radius: 9px; } .btn.danger { color: var(--bad); } .result { margin-top: 14px; } .result .out { font-size: 28px; line-height: 1.5; font-weight: 500; margin: 0; word-break: break-word; } .result .out[dir="ltr"] { text-align: left; } .err { color: var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 10px 14px; margin-top: 14px; } .words-title { margin: 18px 0 8px; font-size: 15px; font-weight: 500; color: var(--muted); } .words { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; } .word { border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: 10px; padding: 8px 12px; background: var(--paper); } .word .en { direction: ltr; text-align: left; font-weight: 600; font-size: 17px; line-height: 1.4; } .word .ar { color: var(--muted); font-size: 16px; line-height: 1.4; } .quiz h2 { margin: 0 0 4px; font-size: 20px; } .quiz .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 14px; } .bar { height: 6px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; margin-bottom: 18px; } .bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; } .q-label { color: var(--muted); font-size: 15px; text-align: center; margin: 0; } .q-word { direction: ltr; text-align: center; font-size: 40px; font-weight: 700; line-height: 1.25; margin: 6px 0 20px; word-break: break-word; } .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } @media (max-width: 480px) { .opts { grid-template-columns: 1fr; } } .opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 12px; font-size: 19px; font-weight: 500; text-align: center; } .opt:hover:not(:disabled) { border-color: var(--accent); } .opt.right { border-color: var(--good); background: var(--good-soft); } .opt.wrong { border-color: var(--bad); background: var(--bad-soft); } .opt:disabled { cursor: default; } .reveal { text-align: center; font-size: 26px; font-weight: 600; min-height: 1.6em; margin: 4px 0 16px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; } .reveal.hidden { color: var(--muted); font-weight: 400; font-size: 16px; } .feedback { text-align: center; margin-top: 14px; font-weight: 500; } .feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); } .score { font-size: 54px; font-weight: 700; text-align: center; line-height: 1.2; margin: 6px 0; } .center { text-align: center; } .missed { margin-top: 14px; } .sec-title { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 10px; } .sec-title h2 { margin: 0; font-size: 19px; } .entry .tx { display: grid; gap: 4px; margin-bottom: 10px; } .entry .a { font-size: 19px; font-weight: 500; } .entry .b { font-size: 17px; color: var(--muted); } .entry [dir="ltr"] { text-align: left; } .entry .tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; } .entry time { color: var(--muted); font-size: 13px; } .empty { text-align: center; color: var(--muted); padding: 28px 12px; } .empty b { display: block; color: var(--ink); font-size: 19px; margin-bottom: 4px; } .spk { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 36px; height: 36px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; line-height: 1; flex: none; } .spk.lbl { font-size: 14px; padding: 0 14px; } .spk:hover { border-color: var(--accent); } .en-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; direction: ltr; } .speak-row { display: flex; justify-content: center; gap: 8px; margin: -10px 0 18px; flex-wrap: wrap; } .word.done { opacity: .65; border-inline-start-color: var(--good); } .examples { display: grid; gap: 8px; } .ex { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--paper); } .ex .en { font-size: 16px; line-height: 1.5; font-weight: 500; text-align: left; } .ex .ar { color: var(--muted); font-size: 15px; } .ex-det summary { cursor: pointer; margin: 12px 0 8px; color: var(--accent); font-weight: 500; } .q-word.rtl { direction: rtl; } .q-sub { text-align: center; font-size: 26px; font-weight: 600; margin: -8px 0 18px; } .q-sent { text-align: center; font-size: 22px; line-height: 1.6; font-weight: 600; margin: 10px 0 6px; } .type-in { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--paper); font-family: inherit; font-size: 22px; text-align: center; color: var(--ink); margin-bottom: 4px; } .type-in.right { border-color: var(--good); background: var(--good-soft); } .type-in.wrong { border-color: var(--bad); background: var(--bad-soft); } .recap { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; color: var(--muted); flex-wrap: wrap; } .recap .en { font-weight: 600; color: var(--ink); } .listen-row { display: flex; justify-content: center; gap: 10px; margin: 10px 0 22px; flex-wrap: wrap; } .listen-row .spk { height: 52px; font-size: 20px; padding: 0 22px; } .save-box { margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--accent); border-radius: 12px; background: var(--accent-soft); } .save-q { margin: 0 0 10px; font-weight: 500; } .save-msg { margin: 0; font-weight: 500; } .save-msg.ok { color: var(--good); } .pick { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 6px; cursor: pointer; } .pick input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; } .pick .pw { font-weight: 600; } .pick .pa { color: var(--muted); } .pick.saved { opacity: .6; cursor: default; } .btns { display: flex; gap: 6px; flex: none; } .spk.del { color: var(--bad); } .hidden-view { display: none; } .src-tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-inline-start: 8px; } @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">ترجمان<small>ترجم، وبعدين اختبر نفسك على الكلمات</small></h1>
    <button class="theme-btn" id="themeBtn" aria-label="تغيير الوضع الليلي">◐</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabTr" aria-selected="true" aria-controls="viewTr">ترجمة</button>
    <button role="tab" id="tabHi" aria-selected="false" aria-controls="viewHi">السجل والأسئلة<span class="count" id="histCount">0</span></button>
  </nav>

  <main>
    <section id="viewTr" role="tabpanel" aria-labelledby="tabTr">
      <div class="card">
        <div class="dir-row"><span>الاتجاه:</span><span class="dir-badge" id="dirBadge">عربي ← إنجليزي</span><span class="hint">يتحدد تلقائياً</span></div>
        <textarea id="input" dir="auto" maxlength="450" placeholder="اكتب كلمة أو جملة بالعربي أو الإنجليزي… والترجمة تطلع لك مباشرة" aria-label="النص المراد ترجمته"></textarea>
        <div class="row">
          <button class="btn primary" id="goBtn">ترجم</button>
          <button class="btn" id="clearBtn">مسح</button>
          <span class="hint grow" id="counter"></span>
          <span class="hint" id="liveState" aria-live="polite"></span>
          <span class="hint" id="netState"></span>
        </div>
        <div id="resultBox" class="result" aria-live="polite"></div>
      </div>

      <div class="card" id="offlineCard">
        <h2 style="margin:0 0 6px;font-size:18px">ترجمة كاملة بدون إنترنت (جودة عالية)</h2>
        <p class="hint" style="margin:0 0 10px">نزّل نموذج الترجمة المتقدم (NLLB) مرة واحدة وأنت متصل. هذا النموذج أذكى بكثير من النموذج القديم، ولن يتجاهل الكلمات.</p>
        <div class="row" style="margin-top:0"><button class="btn primary" id="dlBtn">نزّل نموذج الترجمة</button><span class="hint" id="dlState"></span></div>
        <div class="row" style="margin-top:8px"><button class="btn small danger" id="clearCacheBtn">مسح كاش الترجمات القديمة</button><span class="hint" id="cacheState"></span></div>
      </div>
    </section>

    <section id="viewHi" role="tabpanel" aria-labelledby="tabHi" class="hidden-view">
      <div id="quizBox"></div>
      <div class="sec-title"><h2>سجل الترجمات</h2><button class="btn small danger" id="wipeBtn">حذف الكل</button></div>
      <p class="hint" id="syncState" style="margin-top:-4px"></p>
      <div id="masteredRow" class="row" style="margin:0 0 10px"></div>
      <div class="row" style="margin:0 0 10px"><button class="btn small" id="exportBtn">تصدير نسخة احتياطية</button><button class="btn small" id="importBtn">استيراد نسخة احتياطية</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
      <div id="histList"></div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";
  // ... (باقي دوال المساعدة والتخزين والواجهة تبقى كما هي، سأركز على الجزء المعدل فقط) ...

  // (أفترض أنك تحتفظ بباقي الكود الأساسي: $, h, isArabic, shuffle, norm, canSpeak, speak, إلخ)
  // ... [باقي الكود القديم من بداية السكربت حتى تعريف دالة showError] ...

  /* ============================================================
     المحرك الأول: Google Translate (أفضل جودة أونلاين مجانًا)
     ============================================================ */
  async function googleTranslate(text, dir, signal) {
    const sl = dir === "ar-en" ? "ar" : "en";
    const tl = dir === "ar-en" ? "en" : "ar";
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
    const r = await fetch(url, { signal });
    if (!r.ok) throw new Error("net");
    const j = await r.json();
    if (!j || !j[0] || !Array.isArray(j[0])) throw new Error("bad");
    return j[0].map(x => x && x[0] ? x[0] : "").join("").trim();
  }

  /* ============================================================
     المحرك الثاني: MyMemory (احتياطي)
     ============================================================ */
  async function mm(q, pair, signal) {
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) + "&langpair=" + pair;
    const r = await fetch(url, { signal });
    if (r.status === 429) throw new Error("quota");
    if (!r.ok) throw new Error("net");
    const j = await r.json();
    const t = j && j.responseData && j.responseData.translatedText;
    if (!t || j.quotaFinished || /MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(t)) throw new Error("quota");
    return String(t).replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, "&").trim();
  }

  // تجميع النتائج وإثرائها بالكلمات والأمثلة
  async function onlineTranslate(text, dir, signal) {
    const src = text.slice(0, 450);
    // 1) جرّب Google أولاً (الأفضل)
    try {
      const translation = await googleTranslate(src, dir, signal);
      if (translation) return await enrichWords(text, dir, translation, signal, "Google Translate");
    } catch (e) { if (isAbort(e)) throw e; }
    // 2) إذا فشل Google، استخدم MyMemory
    const translation = await mm(src, dir === "ar-en" ? "ar|en" : "en|ar", signal);
    return await enrichWords(text, dir, translation, signal, "MyMemory");
  }

  // ... (دالة enrichWords كما هي، لكن يمكنك تحسينها لاحقًا) ...

  /* ============================================================
     محرك الأوفلاين الجديد: NLLB-200 (أقوى بكثير من OPUS-MT)
     ============================================================ */
  const MODEL_LIB = "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
  // استبدلنا OPUS-MT بـ NLLB-200
  const MODELS = { "en-ar": "Xenova/nllb-200-distilled-600M", "ar-en": "Xenova/nllb-200-distilled-600M" };
  const MKEY = "tarjuman:model:v1";
  let modelReady = read(MKEY, {}, {});
  let tfLib = null;
  const pipes = {};

  async function getLib() {
    if (!tfLib) { 
        tfLib = await import(MODEL_LIB); 
        tfLib.env.allowLocalModels = false; 
    }
    return tfLib;
  }

  async function getPipe(dir, onProgress) {
    if (!pipes[dir]) {
      const L = await getLib();
      // تمرير أكواد اللغات المطلوبة لـ NLLB
      const srcLang = dir === "ar-en" ? "arb_Arab" : "eng_Latn";
      const tgtLang = dir === "ar-en" ? "eng_Latn" : "arb_Arab";
      
      pipes[dir] = L.pipeline("translation", MODELS[dir], {
        src_lang: srcLang,
        tgt_lang: tgtLang,
        ...(onProgress ? { progress_callback: onProgress } : {})
      });
      pipes[dir].catch(() => { delete pipes[dir]; });
    }
    return pipes[dir];
  }

  // تقسيم النص الطويل إلى جمل لترجمتها بشكل أفضل
  function chunkText(text, maxLength = 400) {
    if (text.length <= maxLength) return [text];
    const chunks = [];
    let current = "";
    const sentences = text.split(/(?<=[.!?؟])\s+/);
    for (const sentence of sentences) {
      if ((current + " " + sentence).length > maxLength && current) {
        chunks.push(current.trim());
        current = sentence;
      } else {
        current += (current ? " " : "") + sentence;
      }
    }
    if (current.trim()) chunks.push(current.trim());
    return chunks;
  }

  async function modelTranslate(text, dir) {
    const p = await getPipe(dir);
    const chunks = chunkText(text);
    let fullTranslation = "";
    
    for (const chunk of chunks) {
      // NLLB يحتاج أحيانًا إلى max_length أكبر
      const out = await p(chunk, { max_length: 512 });
      const part = String((out && out[0] && out[0].translation_text) || "").trim();
      if (part) fullTranslation += (fullTranslation ? " " : "") + part;
    }
    return fullTranslation.trim();
  }

  async function modelFallback(text, dir) {
    const translation = await modelTranslate(text, dir);
    if (!translation) return null;
    // ... (باقي كود إثراء الكلمات يبقى كما هو) ...
    return { translation, words: [], examples: [], note: "من النموذج المتقدم على جهازك (بدون إنترنت)" };
  }

  // ... (باقي الكود: دوال التحميل، doTranslate، والعرض) ...
  // تأكد من أن دالة doTranslate تستدعي modelFallback عندما يكون modelReady[dir] صحيحًا.

  // ... [باقي الكود القديم من تعريف dlBtn حتى نهاية السكربت] ...
})();
</script>
</body>
</html>
