<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترجمان — بنك الكلمات والاختبارات</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0E7C86">
<link rel="manifest" href="manifest.json">
<style>
:root {
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper: #EAF1F2; --surface: #FFFFFF; --ink: #0E2A33; --muted: #5A6F77; --line: #CFDCDF;
  --accent: #0E7C86; --accent-ink: #FFFFFF; --accent-soft: #D7ECEE; --good: #1B8A4B; --good-soft: #D8F0E2;
  --bad: #C2383B; --bad-soft: #F8DEDF; --font: "Readex Pro", system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A181D; --surface: #11262D; --ink: #E7F1F3; --muted: #93AAB2; --line: #234049;
    --accent: #4FC3CC; --accent-ink: #062228; --accent-soft: #14383F; --good: #55D08A;
    --good-soft: #15382A; --bad: #FF8587; --bad-soft: #432024;
  }
}
:root[data-theme="dark"] {
  --paper: #0A181D; --surface: #11262D; --ink: #E7F1F3; --muted: #93AAB2; --line: #234049;
  --accent: #4FC3CC; --accent-ink: #062228; --accent-soft: #14383F; --good: #55D08A;
  --good-soft: #15382A; --bad: #FF8587; --bad-soft: #432024;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; } button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brand { font-weight: 700; font-size: 30px; margin: 0; line-height: 1.2; }
.brand small { display: block; font-weight: 300; font-size: 14px; color: var(--muted); margin-top: 2px; }
.theme-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 42px; height: 42px; display: grid; place-items: center; }
nav.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 5px; margin-bottom: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 5; }
nav.tabs button { border: 0; background: transparent; border-radius: 10px; padding: 10px 8px; font-weight: 500; color: var(--muted); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.count { display: inline-block; min-width: 1.6em; padding: 0 6px; margin-inline-start: 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
nav.tabs button[aria-selected="true"] .count { background: rgba(255,255,255,.22); color: var(--accent-ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.card + .card { margin-top: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.row .grow { flex: 1; }
.hint { color: var(--muted); font-size: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 18px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { opacity: .55; cursor: progress; }
.btn.small { padding: 5px 12px; font-size: 14px; border-radius: 9px; }
.btn.danger { color: var(--bad); }
.input-field { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--paper); font-family: inherit; font-size: 18px; text-align: center; color: var(--ink); margin-bottom: 8px; }
.input-field:focus { border-color: var(--accent); }
.input-field[dir="ltr"] { text-align: left; }
.words-title { margin: 18px 0 8px; font-size: 15px; font-weight: 500; color: var(--muted); }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.word { border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: 10px; padding: 8px 12px; background: var(--paper); display: flex; justify-content: space-between; align-items: center; }
.word .en { direction: ltr; text-align: left; font-weight: 600; font-size: 17px; line-height: 1.4; }
.word .ar { color: var(--muted); font-size: 16px; line-height: 1.4; }
.quiz h2 { margin: 0 0 4px; font-size: 20px; }
.quiz .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 14px; }
.bar { height: 6px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.q-label { color: var(--muted); font-size: 15px; text-align: center; margin: 0; }
.q-word { direction: ltr; text-align: center; font-size: 40px; font-weight: 700; line-height: 1.25; margin: 6px 0 20px; word-break: break-word; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .opts { grid-template-columns: 1fr; } }
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 12px; font-size: 19px; font-weight: 500; text-align: center; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.reveal { text-align: center; font-size: 26px; font-weight: 600; min-height: 1.6em; margin: 4px 0 16px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
.reveal.hidden { color: var(--muted); font-weight: 400; font-size: 16px; }
.feedback { text-align: center; margin-top: 14px; font-weight: 500; }
.feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }
.score { font-size: 54px; font-weight: 700; text-align: center; line-height: 1.2; margin: 6px 0; }
.center { text-align: center; } .missed { margin-top: 14px; }
.spk { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 36px; height: 36px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; line-height: 1; flex: none; }
.spk:hover { border-color: var(--accent); }
.en-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; direction: ltr; }
.speak-row { display: flex; justify-content: center; gap: 8px; margin: -10px 0 18px; flex-wrap: wrap; }
.q-word.rtl { direction: rtl; } 
.q-sub { text-align: center; font-size: 26px; font-weight: 600; margin: -8px 0 18px; }
.type-in { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--paper); font-family: inherit; font-size: 22px; text-align: center; color: var(--ink); margin-bottom: 4px; }
.type-in.right { border-color: var(--good); background: var(--good-soft); } 
.type-in.wrong { border-color: var(--bad); background: var(--bad-soft); }
.recap { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; color: var(--muted); flex-wrap: wrap; }
.recap .en { font-weight: 600; color: var(--ink); }
.listen-row { display: flex; justify-content: center; gap: 10px; margin: 10px 0 22px; flex-wrap: wrap; }
.listen-row .spk { height: 52px; font-size: 20px; padding: 0 22px; }
.btns { display: flex; gap: 6px; flex: none; } 
.spk.del { color: var(--bad); }
.hidden-view { display: none; }
.scramble-letters { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
.scr-btn { width: 45px; height: 45px; font-size: 22px; font-weight: 700; border-radius: 8px; border: 2px solid var(--accent); background: var(--surface); display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
.scr-btn:disabled { opacity: 0.3; border-color: var(--line); }
.scr-answer { font-size: 26px; font-weight: 700; letter-spacing: 2px; text-align: center; min-height: 40px; border-bottom: 2px dashed var(--accent); margin-bottom: 15px; padding-bottom: 5px; direction: ltr;}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">ترجمان<small>بنك الكلمات والاختبارات</small></h1>
    <button class="theme-btn" id="themeBtn" aria-label="تغيير الوضع الليلي">◐</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabQuiz" aria-selected="true" aria-controls="viewQuiz">الاختبار</button>
    <button role="tab" id="tabBank" aria-selected="false" aria-controls="viewBank">بنك الكلمات<span class="count" id="wordCount">0</span></button>
  </nav>

  <main>
    <!-- قسم الاختبار -->
    <section id="viewQuiz" role="tabpanel" aria-labelledby="tabQuiz">
      <div id="quizBox"></div>
    </section>

    <!-- قسم بنك الكلمات -->
    <section id="viewBank" role="tabpanel" aria-labelledby="tabBank" class="hidden-view">
      <div class="card">
        <h2 style="margin:0 0 12px;font-size:18px">إضافة كلمة جديدة</h2>
        <input type="text" id="newEn" class="input-field" dir="ltr" placeholder="English Word (e.g. Apple)" autocomplete="off">
        <input type="text" id="newAr" class="input-field" dir="rtl" placeholder="المعنى بالعربي (e.g. تفاحة)" autocomplete="off">
        <button class="btn primary" id="addBtn" style="width:100%; margin-top:8px;">إضافة الكلمة للبنك</button>
      </div>

      <div class="sec-title row" style="margin: 20px 0 10px; justify-content: space-between;">
        <h2 style="margin:0; font-size:19px;">الكلمات المضافة</h2>
        <div>
          <button class="btn small" id="exportBtn">تصدير</button>
          <button class="btn small" id="importBtn">استيراد</button>
          <input type="file" id="importFile" accept=".json" hidden>
          <button class="btn small danger" id="wipeBtn">حذف الكل</button>
        </div>
      </div>
      
      <div id="bankList"></div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") el.className = attrs[k];
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
    }
    for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
    return el;
  }

  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const norm = (s) => String(s).trim().toLowerCase();
  const normAr = (s) => String(s).trim().toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\u064B-\u065F]/g, '');

  /* ---------- TTS ---------- */
  const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
  let enVoice = null;
  function pickVoice() {
    if (!canSpeak) return;
    const vs = speechSynthesis.getVoices();
    enVoice = vs.find((v) => /^en[-_]US/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
  }
  if (canSpeak) { pickVoice(); if (speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", pickVoice); }
  function speak(t, slow) {
    if (!canSpeak || !t) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US"; if (enVoice) u.voice = enVoice;
    u.rate = slow ? 0.55 : 0.9;
    speechSynthesis.speak(u);
  }
  function speakBtn(t, label, slow) {
    if (!canSpeak) return null;
    return h("button", { class: "spk" + (label ? " lbl" : ""), type: "button", title: "استمع", "aria-label": "استمع لـ: " + t, onclick: (ev) => { ev.stopPropagation(); speak(t, slow); } },
      slow ? "🐢" : "🔊", label ? h("span", null, label) : null);
  }

  /* ---------- Storage ---------- */
  const WKEY = "tarjuman:words:v1", SKEY = "tarjuman:stats:v3";
  let memW = [], memS = {};
  function read(key, fallback, mem) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return mem; }
  }
  function write(key, val, setMem) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { setMem(val); }
  }
  
  // استرجاع الكلمات (إذا كان المستخدم قد استخدم النسخة القديمة، سنحاول استخراج الكلمات من السجل القديم)
  let words = read(WKEY, null, memW);
  if (!words) {
    words = [];
    try {
      const oldHist = JSON.parse(localStorage.getItem("tarjuman:history:v2") || "[]");
      for (const entry of oldHist) {
        if (entry.words) entry.words.forEach(w => { if(w.en && w.ar) words.push({en: w.en, ar: w.ar, s: 0}); });
      }
      // إزالة المكرر
      const map = new Map();
      words.forEach(w => map.set(norm(w.en), w));
      words = Array.from(map.values());
    } catch(e) {}
    write(WKEY, words, (v) => (memW = v));
  }

  let stats = read(SKEY, {}, memS);
  const saveWords = () => write(WKEY, words, (v) => (memW = v));
  const saveStats = () => write(SKEY, stats, (v) => (memS = v));

  /* ---------- Theme & Tabs ---------- */
  $("themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });
  function showTab(name) {
    const isQuiz = name === "quiz";
    $("tabQuiz").setAttribute("aria-selected", isQuiz); $("tabBank").setAttribute("aria-selected", !isQuiz);
    $("viewQuiz").classList.toggle("hidden-view", !isQuiz); $("viewBank").classList.toggle("hidden-view", isQuiz);
    if (!isQuiz) { renderBank(); }
    else { startRound(); }
    window.scrollTo({ top: 0 });
  }
  $("tabQuiz").addEventListener("click", () => showTab("quiz"));
  $("tabBank").addEventListener("click", () => showTab("bank"));
  function updateCount() { $("wordCount").textContent = words.length; }

  /* ---------- Add Word Logic ---------- */
  $("addBtn").addEventListener("click", () => {
    const en = $("newEn").value.trim();
    const ar = $("newAr").value.trim();
    if (!en || !ar) { alert("الرجاء كتابة الكلمة بالإنجليزية والمعنى بالعربي."); return; }
    
    if (words.some(w => norm(w.en) === norm(en))) {
      alert("هذه الكلمة موجودة مسبقاً في البنك!");
      return;
    }

    words.push({ en: en, ar: ar, s: 0 });
    saveWords();
    updateCount();
    $("newEn").value = ""; $("newAr").value = "";
    $("newEn").focus();
    renderBank();
  });

  /* ---------- Bank Render ---------- */
  function renderBank() {
    updateCount();
    const list = $("bankList");
    if (!words.length) {
      list.replaceChildren(h("div", { class: "card empty" }, h("b", null, "البنك فاضي"), "أضف كلماتك الأولى لتبدأ الاختبار!"));
      return;
    }
    list.replaceChildren(
      h("div", { class: "words" }, words.map((w, i) => 
        h("div", { class: "word" },
          h("div", null,
            h("div", { class: "en-row" }, h("div", { class: "en", dir: "ltr" }, w.en), speakBtn(w.en)),
            h("div", { class: "ar" }, w.ar)
          ),
          h("button", { class: "spk del", type: "button", title: "حذف", onclick: () => {
            if(confirm("حذف هذه الكلمة؟")) { words.splice(i, 1); saveWords(); renderBank(); }
          }}, "✕")
        )
      ))
    );
  }

  $("wipeBtn").addEventListener("click", () => {
    if (!confirm("هل أنت متأكد من حذف كل الكلمات؟")) return;
    words = []; saveWords(); updateCount(); renderBank(); startRound();
  });

  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ words }, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob); link.download = "tarjuman_words.json";
    document.body.appendChild(link); link.click(); link.remove();
  });
  
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (Array.isArray(d.words)) {
        // دمج الكلمات الجديدة مع القديمة بدون تكرار
        const map = new Map(words.map(w => [norm(w.en), w]));
        d.words.forEach(w => { if(w.en && w.ar) map.set(norm(w.en), w); });
        words = Array.from(map.values());
        saveWords(); updateCount(); renderBank(); startRound();
        alert("تم استيراد الكلمات بنجاح!");
      }
    } catch (err) { alert("الملف غير صالح."); }
  });

  /* ---------- Quiz Engine ---------- */
  let quiz = null;
  const TRUE_ = "صح", FALSE_ = "غلط";

  function buildQ(w, all) {
    // تحديد أنواع الأسئلة المتاحة بناءً على عدد الكلمات
    let types = [];
    if (all.length >= 4) {
      types = ["mc_ar", "mc_en", "tf", "scramble"];
      if (canSpeak) types.push("listen");
    } else {
      types = ["flip", "type_en", "type_ar"];
    }

    const type = types[Math.floor(Math.random() * types.length)];
    const q = { w, type };

    if (type === "mc_ar" || type === "listen") { 
      q.answer = w.ar; 
      const distractors = all.filter(o => norm(o.ar) !== norm(w.ar)).map(o => o.ar);
      q.options = shuffle([w.ar, ...shuffle(distractors).slice(0, 3)]); 
    }
    else if (type === "mc_en") { 
      q.answer = w.en; 
      const distractors = all.filter(o => norm(o.en) !== norm(w.en)).map(o => o.en);
      q.options = shuffle([w.en, ...shuffle(distractors).slice(0, 3)]); 
    }
    else if (type === "tf") {
      const others = all.filter(o => norm(o.ar) !== norm(w.ar));
      const other = others.length ? others[0].ar : null;
      const truth = !other || Math.random() < 0.5;
      q.shownAr = truth ? w.ar : other;
      q.answer = truth ? TRUE_ : FALSE_;
      q.options = [TRUE_, FALSE_];
    } 
    else if (type === "scramble") {
      q.answer = w.en;
      let letters = w.en.toUpperCase().split("");
      let scrambled = shuffle(letters).join("");
      while (scrambled === w.en.toUpperCase() && w.en.length > 1) {
        scrambled = shuffle(letters).join("");
      }
      q.scrambled = scrambled;
    }
    else if (type === "type_en" || type === "type_ar") {
      q.answer = type === "type_en" ? w.en : w.ar;
    }
    return q;
  }

  function startRound() {
    if (!words.length) { quiz = null; renderQuiz(); return; }
    
    // اختيار 10 كلمات عشوائية (أو أقل إذا كان البنك صغيراً)
    const pool = shuffle(words).slice(0, 10);
    const qs = pool.map(w => buildQ(w, words));
    
    quiz = { qs, i: 0, score: 0, missed: [], answered: false, picked: null, flipped: false, typed: "", lastOk: false, scrambleBuilt: "" };
    renderQuiz();
  }

  function record(word, ok) {
    quiz.lastMastered = false; // يمكنك تفعيل الإتقان لاحقاً إذا أردت
    if (!ok) quiz.missed.push(word); else quiz.score++;
  }

  function finish(ok, picked) {
    if (!quiz || quiz.answered) return;
    quiz.answered = true; quiz.lastOk = ok; quiz.picked = picked == null ? null : picked;
    record(quiz.qs[quiz.i].w, ok); renderQuiz();
  }

  function nextQ() { 
    quiz.i++; quiz.answered = false; quiz.picked = null; quiz.flipped = false; quiz.typed = ""; quiz.scrambleBuilt = ""; 
    renderQuiz(); 
  }

  function optionsBlock(q, ltr) {
    const opts = h("div", { class: "opts" });
    q.options.forEach((o) => {
      const b = h("button", { class: "opt", type: "button", dir: ltr ? "ltr" : null, disabled: quiz.answered, onclick: () => finish(norm(o) === norm(q.answer), o) }, o);
      if (quiz.answered) { if (norm(o) === norm(q.answer)) b.classList.add("right"); else if (quiz.picked === o) b.classList.add("wrong"); }
      opts.append(b);
    });
    return opts;
  }

  function renderQuestion(card, q) {
    const w = q.w;
    const label = (t) => h("p", { class: "q-label" }, t);
    
    switch (q.type) {
      case "mc_ar": 
        card.append(label("ويش معنى هذي الكلمة بالعربي؟"), h("div", { class: "q-word", dir: "ltr" }, w.en), optionsBlock(q, false)); 
        break;
      case "mc_en": 
        card.append(label("ويش الكلمة بالإنجليزي لهذا المعنى؟"), h("div", { class: "q-word rtl" }, w.ar), optionsBlock(q, true)); 
        break;
      case "listen": 
        card.append(label("استمع للكلمة… ويش معناها بالعربي؟"), h("div", { class: "listen-row" }, speakBtn(w.en, "استمع"), speakBtn(w.en, "ببطء", true)), optionsBlock(q, false)); 
        break;
      case "tf": 
        card.append(label("الكلمة ومعناها… صح ولا غلط؟"), h("div", { class: "q-word", dir: "ltr" }, w.en), h("div", { class: "q-sub" }, "= " + q.shownAr), optionsBlock(q, false)); 
        break;
      case "type_en": {
        const inp = h("input", { type: "text", class: "type-in" + (quiz.answered ? (quiz.lastOk ? " right" : " wrong") : ""), dir: "ltr",
          autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "اكتب الكلمة هنا…", disabled: quiz.answered,
          value: quiz.typed || "" });
        const submit = () => { if (quiz.answered || !inp.value.trim()) return; quiz.typed = inp.value; finish(norm(inp.value) === norm(q.answer), inp.value); };
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
        card.append(label("اكتب الكلمة بالإنجليزي لهذا المعنى"), h("div", { class: "q-word rtl" }, w.ar), inp);
        if (!quiz.answered) card.append(h("div", { class: "row", style: "justify-content:center" }, h("button", { class: "btn primary", onclick: submit }, "تحقق")));
        break;
      }
      case "type_ar": {
        const inp = h("input", { type: "text", class: "type-in" + (quiz.answered ? (quiz.lastOk ? " right" : " wrong") : ""), dir: "rtl",
          autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "اكتب المعنى هنا…", disabled: quiz.answered,
          value: quiz.typed || "" });
        const submit = () => { if (quiz.answered || !inp.value.trim()) return; quiz.typed = inp.value; finish(normAr(inp.value) === normAr(q.answer), inp.value); };
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
        card.append(label("اكتب معنى هذه الكلمة بالعربي"), h("div", { class: "q-word", dir: "ltr" }, w.en), inp);
        if (!quiz.answered) card.append(h("div", { class: "row", style: "justify-content:center" }, h("button", { class: "btn primary", onclick: submit }, "تحقق")));
        break;
      }
      case "scramble": {
        card.append(label("رتب الحروف لتكوين الكلمة الإنجليزية"), h("div", { class: "q-word rtl" }, w.ar));
        
        const answerArea = h("div", { class: "scr-answer", dir: "ltr" }, quiz.scrambleBuilt || " "); // مساحة للإجابة
        card.append(answerArea);
        
        const lettersBox = h("div", { class: "scramble-letters", dir: "ltr" });
        const letters = q.scrambled.split("");
        
        letters.forEach((char, index) => {
          const btn = h("button", { class: "scr-btn", type: "button" }, char);
          btn.addEventListener("click", () => {
            if (quiz.answered) return;
            quiz.scrambleBuilt += char;
            btn.disabled = true;
            answerArea.textContent = quiz.scrambleBuilt;
            
            // التحقق التلقائي إذا اكتمل طول الكلمة
            if (quiz.scrambleBuilt.length === q.answer.length) {
              finish(norm(quiz.scrambleBuilt) === norm(q.answer));
            }
          });
          lettersBox.append(btn);
        });
        
        card.append(lettersBox);
        
        const resetBtn = h("button", { class: "btn small", style: "margin-bottom:15px", onclick: () => {
            if (quiz.answered) return;
            quiz.scrambleBuilt = "";
            answerArea.textContent = " ";
            Array.from(lettersBox.children).forEach(b => b.disabled = false);
        }}, "إعادة المحاولة");
        
        if (!quiz.answered) card.append(h("div", { class: "center" }, resetBtn));
        break;
      }
      default: // Flip
        card.append(label("ويش معنى هذي الكلمة بالعربي؟"), h("div", { class: "q-word", dir: "ltr" }, w.en), h("div", { class: "speak-row" }, speakBtn(w.en, "استمع للنطق")),
          h("div", { class: "reveal" + (quiz.flipped ? "" : " hidden") }, quiz.flipped ? w.ar : "فكّر بالمعنى، وبعدين اضغط «اعرض المعنى»"));
        if (!quiz.flipped) card.append(h("div", { class: "center" }, h("button", { class: "btn primary", onclick: () => { quiz.flipped = true; renderQuiz(); } }, "اعرض المعنى")));
        else if (!quiz.answered) card.append(h("div", { class: "row", style: "justify-content:center" },
          h("button", { class: "btn", onclick: () => finish(true) }, "كنت أعرفها"),
          h("button", { class: "btn", onclick: () => finish(false) }, "ما كنت أعرفها")));
    }
  }

  function renderQuiz() {
    const box = $("quizBox");
    if (!quiz || !quiz.qs.length) {
      box.replaceChildren(h("div", { class: "card empty" },
        h("b", null, words.length > 0 ? "لا توجد كلمات كافية" : "بنك الكلمات فاضي"),
        words.length > 0 ? "أضف كلمات أكثر من تبويب (بنك الكلمات) لتبدأ الاختبار." : "اذهب لتبويب (بنك الكلمات) وأضف كلماتك الأولى."));
      return;
    }
    if (quiz.i >= quiz.qs.length) { renderDone(box); return; }

    const q = quiz.qs[quiz.i], w = q.w;
    const pct = Math.round((quiz.i / quiz.qs.length) * 100);
    const card = h("div", { class: "card quiz" },
      h("h2", null, "اختبر نفسك"),
      h("div", { class: "meta" }, h("span", null, "سؤال " + (quiz.i + 1) + " من " + quiz.qs.length), h("span", null, "الصح: " + quiz.score)),
      h("div", { class: "bar", "aria-hidden": "true" }, h("i", { style: "width:" + pct + "%" })));
    
    renderQuestion(card, q);

    if (quiz.answered) {
      const ok = quiz.lastOk;
      let wrongMsg = "غلط.";
      if (q.type === "tf") wrongMsg = "غلط. الصحيح: " + w.en + " = " + w.ar;
      else wrongMsg = "غلط. الجواب الصحيح: " + (q.answer || w.ar);

      card.append(h("div", { class: "feedback " + (ok ? "good" : "bad") }, ok ? "صح! 👏" : wrongMsg));
      card.append(h("div", { class: "recap" }, h("span", { class: "en", dir: "ltr" }, w.en), "=", h("span", null, w.ar), speakBtn(w.en)));
      card.append(h("div", { class: "row", style: "justify-content:center" }, h("button", { class: "btn primary", onclick: nextQ }, quiz.i + 1 >= quiz.qs.length ? "شوف النتيجة" : "السؤال التالي")));
    }
    box.replaceChildren(card);
    if (q.type === "listen" && !quiz.answered && !q.spoken) { q.spoken = true; speak(w.en, false); }
    if ((q.type === "type_en" || q.type === "type_ar") && !quiz.answered) { const el = box.querySelector(".type-in"); if (el) el.focus(); }
  }

  function renderDone(box) {
    const total = quiz.qs.length;
    const card = h("div", { class: "card quiz" },
      h("h2", { class: "center" }, "خلصت الجولة"),
      h("div", { class: "score" }, quiz.score + " / " + total),
      h("p", { class: "center hint" }, quiz.score === total ? "ممتاز! عرفت كل الكلمات." : "راجع الكلمات اللي غلطت فيها وأعد الجولة.")
    );
    if (quiz.missed.length) {
      card.append(h("div", { class: "missed" }, h("p", { class: "words-title" }, "كلمات تحتاج مراجعة"), 
        h("div", { class: "words" }, quiz.missed.map(w => h("div", { class: "word" }, h("div", { class: "en", dir: "ltr" }, w.en), h("div", { class: "ar" }, w.ar))))));
    }
    card.append(h("div", { class: "row", style: "justify-content:center", marginTop: "20px" },
      h("button", { class: "btn primary", onclick: () => startRound() }, "جولة جديدة")));
    box.replaceChildren(card);
  }

  /* ---------- Init ---------- */
  updateCount();
  renderBank();
  startRound();
  
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
